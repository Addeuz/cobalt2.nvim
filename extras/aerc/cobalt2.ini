# vim: ft=dosini
#
# aerc Cobalt2 styleset
# set styleset-name=cobalt2-xxx.ini in 'aerc.conf' to load the style
#

*.default=true
*.normal=true

border.fg=#3b5364
border.bg=#193549

title.fg=#142a3a
title.bg=#0088ff
title.bold=true

header.fg=#ff628c
#header.bg=#193549
header.bold=true

tab.fg=#3b5364
tab.bg=#15232d
tab.selected.fg=#142a3a
tab.selected.bg=#0088ff

statusline_default.fg=#ffffff
statusline_default.bg=#15232d
statusline_error.fg=#f44542
statusline_success.fg=#3ad900

*error.bold=true
*error.fg=#f44542
*warning.fg=#ffc600
*success.fg=#3ad900

dirlist_*.bg=#193549
dirlist_*.fg=#ffffff
dirlist_*.selected.bg=#0050a4
dirlist_*.selected.fg=#ffffff

msglist_*.bg=#193549
msglist_*.fg=#ffffff
msglist_*.selected.bg=#0050a4
#msglist_*.selected.fg=#ffffff
msglist_unread.bold=true
msglist_unread.fg=#0088ff
msglist_marked.fg=#ff9d00
msglist_thread_folded.italic=true
msglist_thread_folded.underline=true
msglist_gutter.bg=#1f4662
msglist_pill.bg=#3b5364
msglist_pill.reverse=false

part_*.fg=#ffffff
part_*.bg=#15232d
part_*.selected.fg=#ffffff
part_*.selected.bg=#3b5364

completion_default.bg=#15232d
completion_default.fg=#ffffff
completion_default.selected.bg=#3b5364
completion_default.selected.fg=#ffffff
completion_gutter.bg=#1f4662
completion_pill.bg=#3b5364
completion_pill.reverse=false

spinner.bg=#193549
spinner.fg=#ffffff

selector_focused.bold=false
selector_focused.bg=#0050a4
selector_focused.fg=#ffffff
selector_chooser.bold=false
selector_chooser.bg=#0050a4
selector_chooser.fg=#ffffff
default.selected.bold=false
default.selected.fg=#ffffff
default.selected.bg=#0050a4

[viewer]
url.underline=true
url.fg=#aaaaaa
header.fg=#9a5feb
signature.fg=#fb94ff
diff_add.fg=#20563a
diff_del.fg=#453848
diff_meta.bold=true
diff_chunk.dim=true
quote_1.fg=#ffc600
quote_2.fg=#a5ff90
quote_3.fg=#80ffbb
quote_3.dim=true
quote_4.fg=#0088ff
quote_4.dim=true
quote_x.fg=#0088ff
quote_x.dim=true


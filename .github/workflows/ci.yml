name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # luassert is built with hererocks, which compiles Lua 5.1 and needs the readline headers
      - run: sudo apt-get update && sudo apt-get install -y libreadline-dev
      - run: ./scripts/test
